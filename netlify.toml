# Deploy no Netlify — site estático gerado por `next build` (output: "export")
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # URL pública usada em metadados, sitemap e Open Graph (alterar para o domínio final)
  NEXT_PUBLIC_SITE_URL = "https://autocastelobranco.netlify.app"

# Página 404 personalizada
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
